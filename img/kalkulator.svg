<g font-family="monospace" font-size="14"><text x="82" y="215" fill="#b94b62">01</text><text x="112" y="215" fill="#d8cbd7">#include &lt;iostream&gt;</text><text x="82" y="245" fill="#b94b62">02</text><text x="112" y="245" fill="#c9c1cb">int main() {</text><text x="82" y="275" fill="#b94b62">03</text><text x="112" y="275" fill="#b9aeb9">  double a, b;</text><text x="82" y="305" fill="#b94b62">04</text><text x="112" y="305" fill="#b9aeb9">  cin &gt;&gt; a &gt;&gt; b;</text><text x="82" y="335" fill="#b94b62">05</text><text x="112" y="335" fill="#b9aeb9">  cout &lt;&lt; a + b;</text><text x="82" y="365" fill="#b94b62">06</text><text x="112" y="365" fill="#c9c1cb">  return 0;</text><text x="82" y="395" fill="#b94b62">07</text><text x="112" y="395" fill="#c9c1cb">}</text></g>
